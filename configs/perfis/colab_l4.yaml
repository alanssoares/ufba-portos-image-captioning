# Colab com GPU L4 (22,5 GB, bf16 nativo). Fine-tuning completo com pesos fp32 +
# Adam 8 bits paginado + gradient checkpointing (~20 GB de pico esperado).
# Se estourar memoria: --set training.finetune.weights_dtype=bf16 (pesos em bf16, ~11 GB).

model:
  dtype: bf16

training:
  common:
    batch_size: 4
    grad_accum: 4
    gradient_checkpointing: true
    num_workers: 2
  finetune:
    llm_mode: full
    optim: paged_adamw_8bit
    batch_size: 2
    grad_accum: 8

generation:
  batch_size: 16

# No Colab: so treino. Rotulos e split normalmente vem da maquina local (pasta data/
# copiada para o Drive); `label` e `split` sao retomaveis/estaveis e nao refazem nada
# que ja exista. No fim, `export` gera o pacote para a inferencia local.
pipeline:
  steps:
    - label
    - split
    - train:base
    - train:pretrain
    - train:finetune
    - train:lora
    - train:qlora
    - export
