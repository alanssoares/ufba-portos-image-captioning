# Colab com GPU L4 (22,5 GB, bf16 nativo). Fine-tuning completo com pesos em bf16 +
# Adam 8 bits paginado + gradient checkpointing (~12 GB de pico esperado). Pesos em fp32
# (~19 GB so de pesos/gradientes/otimizador) nao cabem com folga — para fp32, use a A100.

model:
  dtype: bf16

training:
  common:
    batch_size: 4
    grad_accum: 4
    gradient_checkpointing: true
    num_workers: 2
  finetune:
    llm_mode: full
    weights_dtype: bf16
    optim: paged_adamw_8bit
    batch_size: 2
    grad_accum: 8

generation:
  batch_size: 16

# No Colab: so treino. Rotulos e split normalmente vem da maquina local (pasta data/
# copiada para o Drive); `label` e `split` sao retomaveis/estaveis e nao refazem nada
# que ja exista. No fim, `export` gera o pacote para a inferencia local.
pipeline:
  steps:
    - label
    - split
    - train:base
    - train:pretrain
    - train:finetune
    - train:lora
    - train:qlora
    - export
