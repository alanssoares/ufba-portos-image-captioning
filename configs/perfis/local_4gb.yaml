# Maquina local com GPU de 4 GB: SO INFERENCIA E AVALIACAO.
# O treino roda no Colab (perfis colab_*); os modelos chegam aqui com:
#
#   python -m src import --from <modelos.zip baixado do Drive>
#   python -m src run --config configs/perfis/local_4gb.yaml
#
# Memoria: o Manaca-1B em 16 bits ocupa ~3,4 GB so de pesos, entao todas as
# variantes sao carregadas em 4 bits (generation.load_4bit). Isso muda a comparacao
# em relacao a inferencia em 16 bits — registre na monografia, ou rode com
# --set generation.load_4bit=false numa GPU maior. Sem GPU: --set device=cpu
# (lento, mas sem quantizacao).

model:
  dtype: fp16

generation:
  batch_size: 2
  load_4bit: true

evaluation:
  device: cpu     # BERTScore/CLIPScore na CPU para nao disputar a VRAM

pipeline:
  steps:
    - predict:base
    - predict:pretrain
    - predict:finetune
    - predict:lora
    - predict:qlora
    - predict:gold
    - evaluate
