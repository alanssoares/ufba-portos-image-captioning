# Colab com GPU T4 (15 GB, sem bf16 nativo -> fp16).
#
# O fine-tuning COMPLETO do Qwen3-VL-2B (~2,1 B params) nao cabe na T4: pesos fp32 +
# gradientes + Adam 8 bits passam de 18 GB. Aqui o "finetune" vira PARCIAL: conector +
# as ultimas 8 das 28 camadas do LLM (~400 M params). O relatorio mostra llm_mode=partial
# para deixar isso explicito. Para o completo, use colab_l4 ou colab_a100.
#
# Se aparecer loss NaN (o Qwen3-VL foi treinado em bf16 e fp16 pode estourar):
#   --set model.dtype=fp32

model:
  dtype: fp16

training:
  common:
    batch_size: 4
    grad_accum: 4
    gradient_checkpointing: true
    num_workers: 2
  finetune:
    llm_mode: partial
    unfreeze_last_n_layers: 8
    optim: paged_adamw_8bit
    batch_size: 2
    grad_accum: 8
  lora:
    optim: adamw
  qlora:
    optim: paged_adamw_8bit

generation:
  batch_size: 8

# No Colab: so treino. Rotulos e split normalmente vem da maquina local (pasta data/
# copiada para o Drive); `label` e `split` sao retomaveis/estaveis e nao refazem nada
# que ja exista. No fim, `export` gera o pacote para a inferencia local.
pipeline:
  steps:
    - label
    - split
    - train:base
    - train:pretrain
    - train:finetune
    - train:lora
    - train:qlora
    - export
