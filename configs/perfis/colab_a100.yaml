# Colab com GPU A100 (40 GB, bf16 nativo). Tudo cabe com folga, inclusive o
# fine-tuning completo com pesos fp32 e AdamW 8 bits.

model:
  dtype: bf16
  attn_implementation: sdpa

training:
  common:
    batch_size: 8
    grad_accum: 2
    gradient_checkpointing: false
    num_workers: 4
  finetune:
    llm_mode: full
    optim: adamw_8bit
    gradient_checkpointing: true

generation:
  batch_size: 32

# No Colab: so treino. Rotulos e split normalmente vem da maquina local (pasta data/
# copiada para o Drive); `label` e `split` sao retomaveis/estaveis e nao refazem nada
# que ja exista. No fim, `export` gera o pacote para a inferencia local.
pipeline:
  steps:
    - label
    - split
    - train:base
    - train:pretrain
    - train:finetune
    - train:lora
    - train:qlora
    - export
