# Teste de fumaca: o pipeline inteiro em poucos minutos, com imagens sinteticas, 2 passos
# de treino por variante e o modelo gold "dummy" (sem chave de API). Usa o Qwen3-VL-2B de
# verdade (baixa ~4,5 GB na primeira vez) e precisa de GPU CUDA — a T4 gratuita do Colab
# serve. As metricas nao significam nada: o objetivo e provar que as pecas encaixam.
#
#   python -m src run --config configs/perfis/smoke.yaml

paths:
  root: outputs/smoke          # isola tudo do dataset de verdade

dev:
  n_images: 12

model:
  image_max_side: 224

training:
  common:
    epochs: 1
    max_steps: 2
    batch_size: 2
    grad_accum: 1
    log_every: 1
    gradient_checkpointing: true
  finetune:
    llm_mode: partial          # cabe em qualquer GPU; o completo e testado no treino real
    unfreeze_last_n_layers: 2
    optim: adamw

generation:
  batch_size: 4
  num_beams: 1
  max_new_tokens: 20
  limit: 4

gold_model:
  provider: dummy              # nao chama API

evaluation:
  bertscore: false
  clipscore: false
  n_examples: 2

pipeline:
  steps:
    - dummy-data
    - split
    - train:base
    - train:pretrain
    - train:finetune
    - train:lora
    - train:qlora
    - export
    - predict:base
    - predict:pretrain
    - predict:finetune
    - predict:lora
    - predict:qlora
    - predict:gold
    - evaluate
